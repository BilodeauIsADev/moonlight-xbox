name: Xbox development package

on:
  push:
    branches: [feature/pyrowave-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbox-dev-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Run portable regression tests
        shell: pwsh
        run: |
          cmake -S tests -B tests/build -A x64
          if ($LASTEXITCODE) { throw 'Test configuration failed' }
          cmake --build tests/build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Test build failed' }
          ctest --test-dir tests/build -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Regression tests failed' }

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: xbox-uwp-v143-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: xbox-uwp-v143-

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          .\vcpkg\vcpkg.exe install --triplet x64-uwp --clean-after-build
          if ($LASTEXITCODE) { throw 'vcpkg install failed' }
          .\vcpkg\vcpkg.exe integrate install
          if ($LASTEXITCODE) { throw 'vcpkg MSBuild integration failed' }

      - name: Configure native libraries
        shell: pwsh
        run: |
          $toolchain = "$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          $options = @(
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            '-DVCPKG_TARGET_TRIPLET=x64-uwp',
            '-DCMAKE_SYSTEM_NAME=WindowsStore',
            '-DCMAKE_SYSTEM_VERSION=10.0.19041.0',
            '-DTARGET_UWP=ON', '-DBUILD_SHARED_LIBS=OFF',
            '-DVCPKG_MANIFEST_MODE=ON',
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE"
          )
          cmake -S third_party/moonlight-common-c -B third_party/moonlight-common-c/build @options
          if ($LASTEXITCODE) { throw 'Protocol library configuration failed' }
          cmake -S libgamestream -B libgamestream/build @options
          if ($LASTEXITCODE) { throw 'GameStream library configuration failed' }
          nuget restore moonlight-xbox-dx.sln -NonInteractive
          if ($LASTEXITCODE) { throw 'NuGet restore failed' }

      - name: Create development signing certificate and package version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content Package.appxmanifest
          $manifest.Package.Identity.Version = "26.19.0.$env:GITHUB_RUN_NUMBER"
          $manifest.Save((Join-Path $env:GITHUB_WORKSPACE 'Package.appxmanifest'))
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject $manifest.Package.Identity.Publisher `
            -KeyUsage DigitalSignature -FriendlyName 'Moonlight Xbox development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts/moonlight-development.cer | Out-Null
          "MOONLIGHT_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "MOONLIGHT_PACKAGE_VERSION=$($manifest.Package.Identity.Version)" >> $env:GITHUB_ENV

      - name: Build signed x64 sideload package
        shell: pwsh
        run: |
          msbuild moonlight-xbox-dx.vcxproj /m:2 /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 `
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\artifacts\packages\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:MOONLIGHT_CERT_THUMBPRINT" `
            /p:VcpkgManifestInstall=false
          if ($LASTEXITCODE) { throw 'Xbox package build failed' }
          $bundles = @(Get-ChildItem artifacts -Recurse -Filter *.msixbundle)
          if ($bundles.Count -ne 1) { throw "Expected one MSIX bundle, found $($bundles.Count)" }
          Get-FileHash $bundles[0].FullName -Algorithm SHA256 | Format-List
          @{
            commit = $env:GITHUB_SHA
            version = $env:MOONLIGHT_PACKAGE_VERSION
            sha256 = (Get-FileHash $bundles[0].FullName -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content artifacts/build-info.json

      - name: Preserve application symbols
        if: success()
        shell: pwsh
        run: |
          $symbols = Get-ChildItem -Path . -Recurse -Filter moonlight-xbox-dx.pdb
          New-Item -ItemType Directory -Path artifacts/symbols -Force | Out-Null
          $symbols | Copy-Item -Destination artifacts/symbols

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-xbox-reconnect-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
